<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鱼骨图编辑器 P0 验证页（X6 3.1.8）</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: "Microsoft YaHei", Arial, sans-serif; color: #1f2937; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    header {
      display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px;
      border-bottom: 1px solid #e5e7eb; background: #ffffff; flex: 0 0 auto;
    }
    header h1 { font-size: 15px; font-weight: 600; margin: 0 16px 0 0; white-space: nowrap; }
    header button {
      height: 28px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 4px;
      background: #ffffff; cursor: pointer; font-size: 13px; color: #1f2937;
    }
    header button:hover { border-color: #1a73e8; color: #1a73e8; }
    .hint { margin-left: auto; font-size: 12px; color: #6b7280; white-space: nowrap; }
    main { flex: 1 1 auto; display: flex; min-height: 0; }
    #stencil {
      width: 226px; flex: 0 0 226px; border-right: 1px solid #e5e7eb;
      background: #f9fafb; overflow: auto; position: relative;
    }
    #stencil .x6-widget-stencil { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
    #container-wrap { flex: 1 1 auto; min-width: 0; position: relative; background: #ffffff; }
    #container { width: 100%; height: 100%; }
    #log {
      width: 250px; flex: 0 0 250px; border-left: 1px solid #e5e7eb;
      background: #f9fafb; font-size: 12px; overflow: auto; padding: 8px;
    }
    #log h2 { font-size: 12px; margin: 0 0 6px; color: #4b5563; }
    #log ul { margin: 0; padding: 0; list-style: none; }
    #log li { padding: 3px 0; border-bottom: 1px dashed #e5e7eb; word-break: break-all; }
    #inline-editor {
      position: fixed; z-index: 1000; min-width: 160px; max-width: 420px;
      border: 2px solid #1a73e8; border-radius: 4px; font-size: 14px; padding: 4px 6px;
      outline: none; background: #ffffff; box-shadow: 0 4px 12px rgba(0,0,0,.18);
      display: none; font-family: inherit;
    }
  </style>
</head>
<body>
  <header>
    <h1>鱼骨图编辑器 P0 验证</h1>
    <button id="btn-sample" type="button">加载示例</button>
    <button id="btn-undo" type="button">撤销</button>
    <button id="btn-redo" type="button">重做</button>
    <button id="btn-clear" type="button">清空</button>
    <button id="btn-png" type="button">导出 PNG</button>
    <button id="btn-svg" type="button">导出 SVG</button>
    <button id="btn-save" type="button">存 localStorage</button>
    <button id="btn-load" type="button">恢复 localStorage</button>
    <span class="hint">右键拖动画布平移；Ctrl+滚轮缩放；从组件库拖入元素；双击元素改文字</span>
  </header>
  <main>
    <aside id="stencil"></aside>
    <section id="container-wrap">
      <div id="container"></div>
    </section>
    <aside id="log">
      <h2>验证日志</h2>
      <ul id="log-list"></ul>
    </aside>
  </main>
  <textarea id="inline-editor" rows="2"></textarea>

  <script src="../lib/x6.min.js"></script>
  <script>
  (function () {
    'use strict';

    var logList = document.getElementById('log-list');
    function log(msg) {
      var li = document.createElement('li');
      li.textContent = new Date().toLocaleTimeString() + '  ' + msg;
      logList.insertBefore(li, logList.firstChild);
      while (logList.children.length > 120) logList.removeChild(logList.lastChild);
    }

    // ---------- 端口定义 ----------
    var portAttrs = {
      circle: { r: 5, magnet: true, fill: '#ffffff', stroke: '#1a73e8', strokeWidth: 1 }
    };
    var portGroups = {
      left: { position: 'left', attrs: portAttrs },
      right: { position: 'right', attrs: portAttrs },
      top: { position: 'top', attrs: portAttrs },
      bottom: { position: 'bottom', attrs: portAttrs }
    };
    function portsOf(side) {
      var ids = side.split('|');
      return {
        groups: portGroups,
        items: ids.map(function (name) {
          return { id: 'port-' + name, group: name };
        })
      };
    }

    // ---------- 自定义 shapes ----------
    X6.Graph.registerNode('fish-head', {
      inherit: 'rect',
      markup: [
        { tagName: 'path', selector: 'body' },
        { tagName: 'circle', selector: 'eye' },
        { tagName: 'text', selector: 'label' }
      ],
      attrs: {
        body: {
          fill: '#e8f0fe', stroke: '#1a73e8', strokeWidth: 2,
          refD: 'M 14 40 Q 14 8 64 20 L 78 40 L 64 60 Q 14 72 14 40 Z'
        },
        eye: { cx: 42, cy: 30, r: 5, fill: '#1a73e8', stroke: 'none' },
        label: {
          textAnchor: 'middle', textVerticalAnchor: 'middle',
          fontSize: 13, fill: '#1a3c6e', fontFamily: 'inherit'
        }
      }
    }, true);

    X6.Graph.registerNode('fish-tail', {
      inherit: 'rect',
      markup: [
        { tagName: 'path', selector: 'body' }
      ],
      attrs: {
        body: {
          fill: '#e8f0fe', stroke: '#1a73e8', strokeWidth: 2,
          refD: 'M 4 38 L 40 6 L 32 38 L 40 70 Z'
        }
      }
    }, true);

    X6.Graph.registerNode('fish-spine', {
      inherit: 'rect',
      markup: [{ tagName: 'rect', selector: 'body' }],
      attrs: {
        body: { fill: '#1a73e8', stroke: 'none', rx: 2, ry: 2 }
      }
    }, true);

    X6.Graph.registerNode('bone-node', {
      inherit: 'rect',
      markup: [
        { tagName: 'rect', selector: 'body' },
        { tagName: 'text', selector: 'label' }
      ],
      attrs: {
        body: { fill: '#ffffff', stroke: '#94a3b8', strokeWidth: 1, rx: 6, ry: 6 },
        label: {
          textAnchor: 'middle', textVerticalAnchor: 'middle',
          fontSize: 13, fill: '#1f2937', fontFamily: 'inherit'
        }
      }
    }, true);

    X6.Graph.registerNode('group-node', {
      inherit: 'rect',
      markup: [
        { tagName: 'rect', selector: 'body' },
        { tagName: 'text', selector: 'label' }
      ],
      attrs: {
        body: { fill: '#fef3c7', stroke: '#f59e0b', strokeWidth: 1, rx: 8, ry: 8 },
        label: {
          textAnchor: 'middle', textVerticalAnchor: 'middle',
          fontSize: 14, fill: '#92400e', fontFamily: 'inherit'
        }
      }
    }, true);

    X6.Graph.registerEdge('bone-edge', {
      inherit: 'edge',
      attrs: {
        line: {
          stroke: '#1a73e8', strokeWidth: 2,
          targetMarker: { name: 'block', width: 10, height: 8 },
          strokeLinejoin: 'round'
        }
      },
      connector: { name: 'smooth' },
      zIndex: 0
    }, true);

    // ---------- 画布与插件 ----------
    var graph = new X6.Graph({
      container: document.getElementById('container'),
      background: { color: '#fbfcfe' },
      grid: { visible: true, type: 'dot', args: { color: '#e5e7eb', thickness: 1 } },
      panning: { enabled: true, eventTypes: ['rightMouseDown'] },
      mousewheel: { enabled: true, modifiers: ['ctrl', 'meta'], minScale: 0.2, maxScale: 3 },
      connecting: {
        snap: true,
        allowBlank: false,
        allowLoop: false,
        highlight: true,
        connector: 'smooth',
        connectionPoint: 'boundary',
        anchor: 'center',
        createEdge: function () {
          return graph.createEdge({ shape: 'bone-edge' });
        }
      },
      highlighting: {
        magnetAvailable: { name: 'stroke', args: { padding: 4, attrs: { stroke: '#1a73e8' } } },
        magnetAdsorbed: { name: 'stroke', args: { padding: 4, attrs: { stroke: '#f59e0b' } } }
      }
    });

    var selection = new X6.Selection({ enabled: true, rubberband: true, multiple: true, movable: true, strict: true });
    var snapline = new X6.Snapline({ enabled: true, sharp: true });
    var keyboard = new X6.Keyboard();
    var clipboard = new X6.Clipboard({ useLocalStorage: true });
    var history = new X6.History({ enabled: true });
    var exportPlugin = new X6.Export();
    graph.use(selection);
    graph.use(snapline);
    graph.use(keyboard);
    graph.use(clipboard);
    graph.use(history);
    graph.use(exportPlugin);

    // ---------- 快捷键 ----------
    keyboard.bindKey('ctrl+z', function () { history.undo(); });
    keyboard.bindKey('ctrl+y', function () { history.redo(); });
    keyboard.bindKey('ctrl+shift+z', function () { history.redo(); });
    keyboard.bindKey('delete', removeSelected);
    keyboard.bindKey('backspace', removeSelected);
    keyboard.bindKey('ctrl+c', copySelected);
    keyboard.bindKey('ctrl+x', cutSelected);
    keyboard.bindKey('ctrl+v', function () { clipboard.paste({ offset: 24 }); });

    function selectedCells() {
      return selection.getSelectedCells();
    }
    function removeSelected() {
      var cells = selectedCells();
      if (cells.length) { graph.removeCells(cells); log('删除选中元素 ' + cells.length + ' 个'); }
    }
    function copySelected() {
      var cells = selectedCells();
      if (cells.length) clipboard.copy(cells);
    }
    function cutSelected() {
      var cells = selectedCells();
      if (cells.length) clipboard.cut(cells);
    }

    // ---------- 组件库（Stencil） ----------
    var stencil = new X6.Stencil({
      title: '鱼骨组件库',
      target: graph,
      groups: [
        { name: 'skeleton', title: '鱼骨骨架' },
        { name: 'content', title: '鱼刺与内容' }
      ],
      stencilGraphWidth: 210,
      stencilGraphHeight: 440,
      layoutOptions: { columns: 1, dx: 10, dy: 10 },
      collapsable: true
    });
    document.getElementById('stencil').appendChild(stencil.container);

    stencil.load([
      { shape: 'fish-head', width: 120, height: 80, attrs: { label: { text: '鱼头' } }, ports: portsOf('left|right') },
      { shape: 'fish-tail', width: 90, height: 70, attrs: { label: { text: '鱼尾' } }, ports: portsOf('left|right') },
      { shape: 'fish-spine', width: 170, height: 8, attrs: { body: { fill: '#1a73e8' } }, ports: portsOf('left|right') }
    ], 'skeleton');

    stencil.load([
      { shape: 'bone-node', width: 130, height: 44, attrs: { label: { text: '一级鱼刺' }, body: { fill: '#e8f0fe', stroke: '#1a73e8' } }, ports: portsOf('left|right|top|bottom') },
      { shape: 'bone-node', width: 110, height: 36, attrs: { label: { text: '二级鱼刺' }, body: { fill: '#e0f2fe', stroke: '#0284c7' } }, ports: portsOf('left|right|top|bottom') },
      { shape: 'bone-node', width: 100, height: 32, attrs: { label: { text: '内容节点' } }, ports: portsOf('left|right|top|bottom') },
      { shape: 'group-node', width: 150, height: 60, attrs: { label: { text: '原因分组' } }, ports: portsOf('left|right|top|bottom') }
    ], 'content');

    // ---------- 双击内联编辑 ----------
    var inlineEditor = document.getElementById('inline-editor');
    var editingCell = null;

    function currentText(cell) {
      return cell.attr('label/text') || '';
    }
    function commitEdit() {
      if (!editingCell) return;
      var v = inlineEditor.value;
      var old = currentText(editingCell);
      if (v !== old) {
        editingCell.attr('label/text', v);
        log('文字更新: ' + old + ' → ' + v);
      }
      hideEditor();
    }
    function hideEditor() {
      editingCell = null;
      inlineEditor.style.display = 'none';
    }
    function showEditor(cell, clientPoint) {
      editingCell = cell;
      inlineEditor.value = currentText(cell);
      inlineEditor.style.display = 'block';
      inlineEditor.style.left = Math.max(8, clientPoint.x - 90) + 'px';
      inlineEditor.style.top = (clientPoint.y + 16) + 'px';
      inlineEditor.focus();
      inlineEditor.select();
    }
    inlineEditor.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); commitEdit(); }
      else if (e.key === 'Escape') hideEditor();
    });
    inlineEditor.addEventListener('blur', function () {
      setTimeout(commitEdit, 120);
    });

    function nodeCenterClient(node) {
      var b = node.getBBox();
      return graph.localToClient({ x: b.x + b.width / 2, y: b.y + b.height / 2 });
    }
    graph.on('node:dblclick', function (args) {
      showEditor(args.node, nodeCenterClient(args.node));
    });
    graph.on('edge:dblclick', function (args) {
      var b = args.edge.getBBox();
      showEditor(args.edge, graph.localToClient({ x: b.x + b.width / 2, y: b.y + b.height / 2 }));
    });

    // ---------- 事件与日志 ----------
    ['Selection', 'Stencil', 'Snapline', 'Keyboard', 'Clipboard', 'Export', 'History', 'Dnd'].forEach(function (name) {
      log('插件检查 ' + name + ': ' + (typeof X6[name] === 'function' ? 'OK' : 'MISSING'));
    });
    graph.on('node:added', function () { log('节点已添加'); });
    graph.on('edge:connected', function (args) {
      log('连线完成: ' + args.sourceCell.id + ' → ' + args.targetCell.id);
    });
    graph.on('history:change', function () {
      log('历史变更 undo=' + history.getUndoSize() + ' redo=' + history.getRedoSize());
    });

    // ---------- 示例图 ----------
    function loadSample() {
      graph.clearCells();
      var spine = graph.addNode({
        id: 'spine', shape: 'fish-spine', x: 130, y: 283, width: 430, height: 8,
        ports: portsOf('left|right|top|bottom')
      });
      var head = graph.addNode({
        id: 'head', shape: 'fish-head', x: 570, y: 248, width: 110, height: 80,
        attrs: { label: { text: '护理不良事件' } },
        ports: portsOf('left|right')
      });
      var tail = graph.addNode({
        id: 'tail', shape: 'fish-tail', x: 34, y: 262, width: 90, height: 70,
        ports: portsOf('left|right')
      });
      var n1 = graph.addNode({
        id: 'n1', shape: 'bone-node', x: 190, y: 120, width: 110, height: 40,
        attrs: { label: { text: '人' }, body: { fill: '#e8f0fe', stroke: '#1a73e8' } },
        ports: portsOf('left|right|top|bottom')
      });
      var n2 = graph.addNode({
        id: 'n2', shape: 'bone-node', x: 190, y: 440, width: 110, height: 40,
        attrs: { label: { text: '机' }, body: { fill: '#e8f0fe', stroke: '#1a73e8' } },
        ports: portsOf('left|right|top|bottom')
      });
      var n3 = graph.addNode({
        id: 'n3', shape: 'bone-node', x: 350, y: 64, width: 140, height: 36,
        attrs: { label: { text: '操作不熟练' } },
        ports: portsOf('left|right|top|bottom')
      });
      var n4 = graph.addNode({
        id: 'n4', shape: 'bone-node', x: 350, y: 510, width: 140, height: 36,
        attrs: { label: { text: '设备老化' } },
        ports: portsOf('left|right|top|bottom')
      });
      graph.addEdge({ shape: 'bone-edge', source: { cell: tail.id, port: 'port-right' }, target: { cell: spine.id, port: 'port-left' } });
      graph.addEdge({ shape: 'bone-edge', source: { cell: spine.id, port: 'port-right' }, target: { cell: head.id, port: 'port-left' } });
      graph.addEdge({ shape: 'bone-edge', source: { cell: spine.id, port: 'port-top' }, target: { cell: n1.id, port: 'port-bottom' } });
      graph.addEdge({ shape: 'bone-edge', source: { cell: spine.id, port: 'port-bottom' }, target: { cell: n2.id, port: 'port-top' } });
      graph.addEdge({ shape: 'bone-edge', source: { cell: n1.id, port: 'port-right' }, target: { cell: n3.id, port: 'port-left' } });
      graph.addEdge({ shape: 'bone-edge', source: { cell: n2.id, port: 'port-right' }, target: { cell: n4.id, port: 'port-left' } });
      log('示例鱼骨图已加载');
    }

    // ---------- 工具栏 ----------
    document.getElementById('btn-sample').addEventListener('click', loadSample);
    document.getElementById('btn-undo').addEventListener('click', function () { history.undo(); });
    document.getElementById('btn-redo').addEventListener('click', function () { history.redo(); });
    document.getElementById('btn-clear').addEventListener('click', function () {
      graph.clearCells();
      log('画布已清空');
    });
    document.getElementById('btn-png').addEventListener('click', function () {
      exportPlugin.exportPNG('鱼骨图P0');
      log('导出 PNG');
    });
    document.getElementById('btn-svg').addEventListener('click', function () {
      exportPlugin.exportSVG('鱼骨图P0');
      log('导出 SVG');
    });
    document.getElementById('btn-save').addEventListener('click', function () {
      var doc = {
        version: '1.0',
        title: document.title,
        savedAt: new Date().toISOString(),
        graph: graph.toJSON()
      };
      localStorage.setItem('ygt-p0-doc', JSON.stringify(doc));
      log('已保存到 localStorage，节点=' + graph.getNodes().length + ' 边=' + graph.getEdges().length);
    });
    document.getElementById('btn-load').addEventListener('click', function () {
      var raw = localStorage.getItem('ygt-p0-doc');
      if (!raw) { log('localStorage 无存档'); return; }
      try {
        var doc = JSON.parse(raw);
        graph.fromJSON(doc.graph);
        log('已从 localStorage 恢复');
      } catch (e) {
        log('恢复失败: ' + e.message);
      }
    });

    loadSample();
  })();
  </script>
</body>
</html>
